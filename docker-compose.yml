version: '3.8'

services:
  mediasocial-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediasocial-team-portal
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "coolify.managed=true"
