version: '3.8'

services:
  mediasocial-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediasocial-team-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/healthz || wget --quiet --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"
